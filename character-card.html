<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>캐릭터 상태 카드</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #0d0d0d;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        #card-container {
            box-shadow: 0 10px 50px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body>
    <div id="card-container"></div>

    <script>
        // XSS 방지를 위한 HTML 문자열 이스케이프 함수
        function escapeHTML(str) {
            if (!str) return '';
            return String(str).replace(/[&<>'"]/g, tag => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                "'": '&#39;',
                '"': '&quot;'
            }[tag]));
        }

        // URL 파라미터 파싱
        function getParams() {
            const params = new URLSearchParams(window.location.search);
            return {
                // 기본 정보 (보안을 위해 escapeHTML 적용)
                name: escapeHTML(params.get('name')) || '캐릭터 이름',
                title: escapeHTML(params.get('title')) || '칭호',
                class: escapeHTML(params.get('class')) || '역할',
                faction: escapeHTML(params.get('faction')) || '소속',
                
                comment: escapeHTML(params.get('comment')) || '',
                custom_label: escapeHTML(params.get('custom_label')) || '',
                custom: escapeHTML(params.get('custom')) || '',
                
                trait1: escapeHTML(params.get('trait1')) || '',
                trait2: escapeHTML(params.get('trait2')) || '',
                trait3: escapeHTML(params.get('trait3')) || '',
                trait4: escapeHTML(params.get('trait4')) || '',
                
                stats: params.get('stats') ? params.get('stats').split(',').map(Number) : [50, 50, 50, 50, 50, 50],
                labels: params.get('labels') ? params.get('labels').split(',').map(escapeHTML) : ['힘', '민첩', '체력', '지능', '정신', '매력'],
                
                logo: escapeHTML(params.get('logo')) || '',
                color: escapeHTML(params.get('color')) || '200,150,80',
                bgColor: escapeHTML(params.get('bg')) || '1a1a1a'
            };
        }

        // 육각형 좌표 생성
        function generateHexagonPoints(stats, maxRadius = 70) {
            const points = [];
            const angleStep = Math.PI / 3;

            stats.forEach((stat, i) => {
                const radius = (stat / 100) * maxRadius;
                const angle = angleStep * i - Math.PI / 2;
                const x = (radius * Math.cos(angle)).toFixed(2);
                const y = (radius * Math.sin(angle)).toFixed(2);
                points.push(`${x},${y}`);
            });

            return points.join(' ');
        }

        // SVG 생성
        function generateSVG(data) {
            const { 
                name, title, class: cls, faction, 
                comment, custom_label, custom,
                trait1, trait2, trait3, trait4,
                stats, labels, logo, color, bgColor 
            } = data;
            
            // 스탯 6개로 맞춤
            while (stats.length < 6) stats.push(0);
            while (labels.length < 6) labels.push('');
            
            const statPoints = generateHexagonPoints(stats);
            
            // 색상 오류 방지 (안전장치 추가)
            let [r, g, b] = color.split(',').map(c => parseInt(c.trim()));
            if (isNaN(r) || isNaN(g) || isNaN(b)) { r = 200; g = 150; b = 80; }
            
            // 특성 필터링
            const traits = [trait1, trait2, trait3, trait4].filter(t => t && t.trim() !== '');
            
            // 섹션 체크
            const hasComment = comment && comment.trim() !== '';
            const hasCustom = custom && custom.trim() !== '';

            // 💡 [버그 수정] 특성(Traits) Y 좌표 동적 계산
            let traitsLabelY = 33;
            let traitsBaseY = 48;
            if (hasComment && hasCustom) {
                traitsLabelY = 273;
                traitsBaseY = 288;
            } else if (hasCustom) {
                traitsLabelY = 243;
                traitsBaseY = 258;
            } else if (hasComment) {
                traitsLabelY = 163;
                traitsBaseY = 178;
            }
            
            return `
<svg width="720" height="400" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <style>
            /* 💡 [버그 수정] &amp; 를 & 로 변경하여 폰트 로딩 정상화 */
            @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700;900&display=swap');
        </style>
        <clipPath id="logo-clip">
            <circle cx="60" cy="60" r="45" />
        </clipPath>
        <pattern id="grid-pattern" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
            <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(${r}, ${g}, ${b}, 0.05)" stroke-width="0.5"/>
        </pattern>
    </defs>
    
    <style>
        .card-bg { fill: #${bgColor}; }
        .card-border { fill: none; stroke: rgb(${r}, ${g}, ${b}); stroke-width: 2; rx: 5; }
        .section-border { fill: none; stroke: #333; stroke-width: 1; rx: 3; }
        .divider { stroke: #444; stroke-width: 1; }
        .accent-line { stroke: rgb(${r}, ${g}, ${b}); stroke-width: 2; }
        
        .logo-bg { fill: #252525; stroke: rgb(${r}, ${g}, ${b}); stroke-width: 2; }
        .logo-placeholder { fill: #333; }
        .logo-text { font-family: 'Noto Sans KR', sans-serif; font-size: 10px; fill: #666; text-anchor: middle; }
        
        .speech-bubble { fill: #2a2a2a; stroke: rgba(${r}, ${g}, ${b}, 0.5); stroke-width: 1.5; }
        
        .text-name { font-family: 'Noto Sans KR', sans-serif; font-weight: 900; font-size: 28px; fill: rgb(${r}, ${g}, ${b}); }
        .text-title { font-family: 'Noto Sans KR', sans-serif; font-weight: 300; font-size: 14px; fill: #aaa; font-style: italic; }
        .text-info { font-family: 'Noto Sans KR', sans-serif; font-weight: 400; font-size: 13px; fill: #999; }
        .text-label { font-family: 'Noto Sans KR', sans-serif; font-weight: 700; font-size: 10px; fill: rgb(${r}, ${g}, ${b}); text-transform: uppercase; letter-spacing: 1px; }
        
        .stat-grid { fill: none; stroke: #333; stroke-width: 1; }
        .stat-grid-line { stroke: #333; stroke-width: 0.5; }
        .stat-polygon { fill: rgba(${r}, ${g}, ${b}, 0.3); stroke: rgb(${r}, ${g}, ${b}); stroke-width: 2; }
        .stat-label { font-family: 'Noto Sans KR', sans-serif; font-size: 11px; fill: #aaa; text-anchor: middle; font-weight: 600; }
        .stat-value { font-family: 'Noto Sans KR', sans-serif; font-size: 10px; fill: rgb(${r}, ${g}, ${b}); text-anchor: middle; font-weight: 700; }
    </style>

    <rect class="card-bg" width="720" height="400" />
    <rect fill="url(#grid-pattern)" width="720" height="400" />
    <rect class="card-border" x="1" y="1" width="718" height="398" />

    <g id="left-section">
        <g id="logo-area">
            ${logo ? `
            <circle class="logo-bg" cx="60" cy="60" r="45" />
            <image href="${logo}" x="15" y="15" width="90" height="90" clip-path="url(#logo-clip)" preserveAspectRatio="xMidYMid slice" />
            ` : `
            <circle class="logo-bg" cx="60" cy="60" r="45" />
            <circle class="logo-placeholder" cx="60" cy="60" r="40" />
            <text class="logo-text" x="60" y="63">LOGO</text>
            `}
        </g>

        <text class="text-name" x="130" y="55">${name}</text>
        <text class="text-title" x="130" y="76">${title}</text>
        <line class="accent-line" x1="130" y1="86" x2="220" y2="86" />
        <text class="text-info" x="130" y="105">${cls}</text>
        <text class="text-info" x="130" y="123">${faction}</text>
    </g>

    <g id="center-section">
        <rect class="section-border" x="245" y="15" width="190" height="370" />
        <text class="text-label" x="340" y="33" text-anchor="middle">STATS</text>
        
        <g id="stat-graph" transform="translate(340, 210)">
            <polygon class="stat-grid" points="0,-70 60.62,-35 60.62,35 0,70 -60.62,35 -60.62,-35" />
            <polygon class="stat-grid" points="0,-35 30.31,-17.5 30.31,17.5 0,35 -30.31,17.5 -30.31,-17.5" />
            
            <line class="stat-grid-line" x1="0" y1="0" x2="0" y2="-70" />
            <line class="stat-grid-line" x1="0" y1="0" x2="60.62" y2="-35" />
            <line class="stat-grid-line" x1="0" y1="0" x2="60.62" y2="35" />
            <line class="stat-grid-line" x1="0" y1="0" x2="0" y2="70" />
            <line class="stat-grid-line" x1="0" y1="0" x2="-60.62" y2="35" />
            <line class="stat-grid-line" x1="0" y1="0" x2="-60.62" y2="-35" />

            <polygon class="stat-polygon" points="${statPoints}" />

            <text class="stat-label" x="0" y="-83">${labels[0]}</text>
            <text class="stat-value" x="0" y="-73">${stats[0]}</text>
            
            <text class="stat-label" x="73" y="-40">${labels[1]}</text>
            <text class="stat-value" x="73" y="-30">${stats[1]}</text>
            
            <text class="stat-label" x="73" y="50">${labels[2]}</text>
            <text class="stat-value" x="73" y="60">${stats[2]}</text>
            
            <text class="stat-label" x="0" y="88">${labels[3]}</text>
            <text class="stat-value" x="0" y="98">${stats[3]}</text>
            
            <text class="stat-label" x="-73" y="50">${labels[4]}</text>
            <text class="stat-value" x="-73" y="60">${stats[4]}</text>
            
            <text class="stat-label" x="-73" y="-40">${labels[5]}</text>
            <text class="stat-value" x="-73" y="-30">${stats[5]}</text>
        </g>
    </g>

    <g id="right-section">
        <rect class="section-border" x="455" y="15" width="250" height="370" />
        
        ${hasComment ? `
        <g id="comment-section">
            <text class="text-label" x="470" y="33">주변인 코멘트</text>
            <path class="speech-bubble" d="M 475 45 L 680 45 Q 685 45 685 50 L 685 115 Q 685 120 680 120 L 490 120 L 480 130 L 485 120 L 480 120 Q 475 120 475 115 L 475 50 Q 475 45 480 45 Z" />
            <foreignObject x="485" y="52" width="190" height="63">
                <div xmlns="http://www.w3.org/1999/xhtml" style="color: #ddd; font-family: 'Noto Sans KR', sans-serif; font-size: 11px; line-height: 1.4;">
                    "${comment}"
                </div>
            </foreignObject>
        </g>
        <line class="divider" x1="470" y1="145" x2="690" y2="145" />
        ` : ''}

        ${hasCustom ? `
        <g id="custom-section">
            <text class="text-label" x="470" y="${hasComment ? '163' : '33'}">${custom_label || 'INFO'}</text>
            <foreignObject x="470" y="${hasComment ? '170' : '40'}" width="225" height="${hasComment ? '80' : '180'}">
                <div xmlns="http://www.w3.org/1999/xhtml" style="color: #ccc; font-family: 'Noto Sans KR', sans-serif; font-size: 11px; line-height: 1.5;">
                    ${custom}
                </div>
            </foreignObject>
        </g>
        <line class="divider" x1="470" y1="${hasComment ? '255' : '225'}" x2="690" y2="${hasComment ? '255' : '225'}" />
        ` : ''}

        ${traits.length > 0 ? `
        <g id="traits">
            <text class="text-label" x="470" y="${traitsLabelY}">특성</text>
            ${traits.map((trait, i) => {
                const yPos = traitsBaseY + (i * 18);
                return `
                <circle cx="475" cy="${yPos}" r="2" fill="rgb(${r}, ${g}, ${b})" />
                <text style="font-family: 'Noto Sans KR', sans-serif; font-size: 11px; fill: #ccc;" x="485" y="${yPos + 4}">${trait}</text>
                `;
            }).join('')}
        </g>
        ` : ''}
    </g>

    <line stroke="rgb(${r}, ${g}, ${b})" stroke-width="2" x1="10" y1="10" x2="28" y2="10" />
    <line stroke="rgb(${r}, ${g}, ${b})" stroke-width="2" x1="10" y1="10" x2="10" y2="28" />
    
    <line stroke="rgb(${r}, ${g}, ${b})" stroke-width="2" x1="710" y1="10" x2="692" y2="10" />
    <line stroke="rgb(${r}, ${g}, ${b})" stroke-width="2" x1="710" y1="10" x2="710" y2="28" />
    
    <line stroke="rgb(${r}, ${g}, ${b})" stroke-width="2" x1="10" y1="390" x2="28" y2="390" />
    <line stroke="rgb(${r}, ${g}, ${b})" stroke-width="2" x1="10" y1="390" x2="10" y2="372" />
    
    <line stroke="rgb(${r}, ${g}, ${b})" stroke-width="2" x1="710" y1="390" x2="692" y2="390" />
    <line stroke="rgb(${r}, ${g}, ${b})" stroke-width="2" x1="710" y1="390" x2="710" y2="372" />
</svg>`;
        }

        window.addEventListener('DOMContentLoaded', () => {
            const data = getParams();
            const svgCode = generateSVG(data);
            document.getElementById('card-container').innerHTML = svgCode;
        });
    </script>
</body>
</html>
