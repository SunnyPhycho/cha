<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 에셋 마스터 매니저 v3.1</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #0d0d0d;
            --panel-color: #181818;
            --accent-color: #4A90E2;
            --text-color: #e0e0e0;
            --border-color: #2a2a2a;
            --input-bg: #222;
        }
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        /* --- Auth Overlay --- */
        #auth-overlay {
            position: fixed; top:0; left:0; width:100%; height:100%;
            background: var(--bg-color); z-index: 1000;
            display: flex; justify-content: center; align-items: center;
        }
        .auth-box {
            background: var(--panel-color); padding: 30px; border-radius: 12px;
            border: 1px solid var(--border-color); width: 300px; text-align: center;
        }
        .auth-box input {
            width: 100%; padding: 10px; margin: 10px 0; 
            background: var(--input-bg); border: 1px solid var(--border-color); color: white;
            box-sizing: border-box; border-radius: 4px;
        }
        .auth-box button {
            width: 100%; padding: 10px; background: var(--accent-color); 
            color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;
        }

        /* --- Main Layout --- */
        #sidebar {
            width: 320px; background: var(--panel-color);
            border-right: 1px solid var(--border-color);
            display: flex; flex-direction: column;
        }
        .sidebar-header {
            padding: 20px; border-bottom: 1px solid var(--border-color);
        }
        .category-tabs {
            display: flex; gap: 5px; margin-bottom: 15px;
        }
        .tab-btn {
            flex: 1; padding: 8px 5px; background: #2a2a2a; color: #888;
            border: 1px solid var(--border-color); border-radius: 4px; cursor: pointer;
            font-size: 11px; transition: 0.2s;
        }
        .tab-btn.active {
            background: var(--accent-color); color: white; border-color: var(--accent-color);
        }
        #asset-list {
            flex: 1; overflow-y: auto; padding: 10px;
        }
        .asset-item {
            display: flex; align-items: center; padding: 10px;
            background: #222; margin-bottom: 8px; border-radius: 8px;
            cursor: pointer; border: 1px solid transparent; transition: 0.2s;
        }
        .asset-item:hover { border-color: var(--accent-color); }
        .asset-item.active { background: var(--accent-color); color: white; }
        .asset-thumb {
            width: 40px; height: 40px; border-radius: 4px;
            background: #333; margin-right: 12px; object-fit: cover;
        }

        #main-content {
            flex: 1; display: flex; flex-direction: column;
            padding: 30px; overflow-y: auto;
        }
        .editor-panel {
            background: var(--panel-color); padding: 25px;
            border-radius: 12px; border: 1px solid var(--border-color);
            display: none;
        }
        .editor-panel.active { display: block; }
        
        textarea {
            width: 100%; height: 250px; background: var(--input-bg); color: #ddd;
            border: 1px solid var(--border-color); padding: 15px;
            font-family: monospace; font-size: 14px; box-sizing: border-box;
            border-radius: 8px; resize: vertical;
        }
        .action-bar {
            display: flex; justify-content: space-between; margin-top: 20px;
        }
        .btn { padding: 10px 20px; border-radius: 4px; cursor: pointer; border: none; font-weight: bold; }
        .btn-primary { background: var(--accent-color); color: white; }
        .btn-danger { background: #c0392b; color: white; }
        .btn-ghost { background: transparent; color: #aaa; border: 1px solid var(--border-color); }

        .ref-image-preview {
            width: 100%; max-width: 300px; border-radius: 8px;
            margin-bottom: 15px; border: 2px solid var(--border-color);
        }
        .hidden { display: none !important; }

        /* --- Setting Panel --- */
        .setting-group {
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
        }
        .setting-row {
            display: flex; align-items: center; gap: 15px; margin-bottom: 15px;
        }
        .setting-row label { width: 120px; font-size: 14px; color: #aaa; }
        .setting-row input, .setting-row select {
            flex: 1; padding: 8px; background: var(--input-bg); 
            border: 1px solid var(--border-color); color: white; border-radius: 4px;
        }
        .slider-container {
            display: flex; align-items: center; gap: 10px; width: 100%;
        }
        .slider-container input { flex: 1; }
        .slider-container span { width: 40px; text-align: right; font-family: monospace; }
    </style>
</head>
<body>

    <div id="auth-overlay">
        <div class="auth-box">
            <h2 id="auth-title">로그인</h2>
            <input type="email" id="auth-email" placeholder="이메일">
            <input type="password" id="auth-pw" placeholder="비밀번호">
            <button id="auth-btn">확인</button>
            <p style="font-size: 12px; color: #888; margin-top: 15px; cursor: pointer;" id="auth-toggle">계정이 없으신가요? 회원가입</p>
        </div>
    </div>

    <div id="sidebar">
        <div class="sidebar-header">
            <h3>에셋 마스터 v3.1</h3>
            <div class="category-tabs">
                <button class="tab-btn active" data-category="chars">캐릭터</button>
                <button class="tab-btn" data-category="situations">상황</button>
                <button class="tab-btn" data-category="moods">분위기</button>
                <button class="tab-btn" data-category="props">소품</button>
                <button class="tab-btn" data-category="global">⚙️설정</button>
            </div>
            <div id="add-asset-box" style="display:flex; gap:5px; margin-top:10px;">
                <input type="text" id="new-asset-name" placeholder="이름 입력" style="flex:1; padding:5px; background:#2a2a2a; color:white; border:1px solid #333;">
                <button id="add-asset-btn" class="btn btn-primary" style="padding:5px 10px;">+</button>
            </div>
            <button id="logout-btn" class="btn btn-ghost" style="width:100%; margin-top:10px; font-size:12px;">로그아웃</button>
        </div>
        <div id="asset-list"></div>
    </div>

    <div id="main-content">
        <div id="welcome-msg" style="text-align:center; margin-top:100px; color:#666;">
            <h2>에셋을 선택하거나 새로 추가해주세요.</h2>
        </div>

        <div id="editor" class="editor-panel">
            <h2 id="edit-asset-name">에셋 이름</h2>
            
            <div style="display:flex; gap:20px; margin-bottom:20px;">
                <div style="flex:1">
                    <label style="display:block; margin-bottom:10px; font-size:14px; color:#aaa;">프롬프트 (쉼표 구분 태그 추천)</label>
                    <textarea id="prompt-text"></textarea>
                </div>
                <div style="width:320px; text-align:center;">
                    <label style="display:block; margin-bottom:10px; font-size:14px; color:#aaa;">레퍼런스 이미지</label>
                    <img id="ref-preview" class="ref-image-preview" src="" alt="레퍼런스 없음">
                    <input type="file" id="ref-upload" class="hidden" accept="image/*">
                    <button id="upload-img-btn" class="btn btn-ghost" style="width:100%; margin-top:10px;">이미지 교체</button>
                    
                    <div style="margin-top:20px; text-align:left;">
                        <div class="setting-row">
                            <label>Strength</label>
                            <div class="slider-container">
                                <input type="range" id="ref-strength" min="0" max="1" step="0.05" value="0.6">
                                <span id="strength-val">0.6</span>
                            </div>
                        </div>
                        <div class="setting-row">
                            <label>Fidelity</label>
                            <div class="slider-container">
                                <input type="range" id="ref-fidelity" min="0" max="1" step="0.05" value="0.8">
                                <span id="fidelity-val">0.8</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="action-bar">
                <button id="delete-asset-btn" class="btn btn-danger">에셋 삭제</button>
                <button id="save-asset-btn" class="btn btn-primary">에셋 저장</button>
            </div>
        </div>

        <div id="global-editor" class="editor-panel">
            <h2>시스템 글로벌 설정</h2>
            
            <div class="setting-group">
                <h3>API 및 엔진 설정</h3>
                <div class="setting-row">
                    <label>AI Provider</label>
                    <select id="global-provider">
                        <option value="stability">Stability AI</option>
                        <option value="novelai">NovelAI</option>
                        <option value="openai">OpenAI (DALL-E 3)</option>
                        <option value="custom">Custom API</option>
                    </select>
                </div>
                <div class="setting-row">
                    <label>API Key</label>
                    <input type="password" id="global-api-key" placeholder="API 키를 입력하세요.">
                </div>
            </div>

            <div class="setting-group">
                <h3>기본 프롬프트 (모든 생성에 추가)</h3>
                <div class="setting-row" style="align-items:flex-start;">
                    <label>Base Positive</label>
                    <textarea id="global-positive" style="height:80px;"></textarea>
                </div>
                <div class="setting-row" style="align-items:flex-start;">
                    <label>Base Negative</label>
                    <textarea id="global-negative" style="height:80px;"></textarea>
                </div>
            </div>

            <div class="action-bar">
                <button id="save-global-btn" class="btn btn-primary">글로벌 설정 저장</button>
            </div>
        </div>
    </div>

    <script>
        // 🚨 [필독] Supabase 정보를 입력하세요!
        const SUPABASE_URL = 'https://klhypvvxaokucaycyxrv.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtsaHlwdnZ4YW9rdWNheWN5eHJ2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk5MDg0ODgsImV4cCI6MjA5NTQ4NDQ4OH0.vp3RMzjzXqUtWC92YIx-yWi46YnUD3_wQA_DPQFSEO4';

        // 변수명 충돌 해결: supabase -> supabaseClient로 변경
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = null;
        let selectedAsset = null;
        let currentCategory = 'chars'; 
        let isSignUpMode = false;

        // --- Auth Logic ---
        const authOverlay = document.getElementById('auth-overlay');
        const authTitle = document.getElementById('auth-title');
        const authEmail = document.getElementById('auth-email');
        const authPw = document.getElementById('auth-pw');
        const authBtn = document.getElementById('auth-btn');
        const authToggle = document.getElementById('auth-toggle');

        authToggle.onclick = () => {
            isSignUpMode = !isSignUpMode;
            authTitle.innerText = isSignUpMode ? '회원가입' : '로그인';
            authToggle.innerText = isSignUpMode ? '이미 계정이 있나요? 로그인' : '계정이 없으신가요? 회원가입';
        };

        authBtn.onclick = async () => {
            const email = authEmail.value;
            const password = authPw.value;
            if(!email || !password) return alert('입력해주세요.');

            const { data, error } = isSignUpMode 
                ? await supabaseClient.auth.signUp({ email, password })
                : await supabaseClient.auth.signInWithPassword({ email, password });

            if (error) alert(error.message);
            else {
                authOverlay.classList.add('hidden');
                currentUser = data.user;
                loadAssets();
            }
        };

        document.getElementById('logout-btn').onclick = async () => {
            await supabaseClient.auth.signOut();
            location.reload();
        };

        // --- Asset & Global Logic ---
        async function loadAssets() {
            if(!currentUser) return;
            const folderPath = `users/${currentUser.id}/${currentCategory}`;
            
            if(currentCategory === 'global') {
                loadGlobalSettings();
                return;
            }

            const { data: files, error } = await supabaseClient.storage.from('user-assets').list(folderPath);
            if(error) return console.error(error);

            const assets = {};
            files.forEach(file => {
                const dotIndex = file.name.lastIndexOf('.');
                const name = file.name.substring(0, dotIndex);
                const ext = file.name.substring(dotIndex + 1).toLowerCase();

                if(!assets[name]) assets[name] = { name, prompt: null, image: null, config: null };
                if(ext === 'txt') assets[name].prompt = file.name;
                if(['webp', 'png', 'jpg', 'jpeg'].includes(ext)) assets[name].image = file.name;
                if(ext === 'json') assets[name].config = file.name;
            });

            const listEl = document.getElementById('asset-list');
            listEl.innerHTML = '';
            
            Object.values(assets).forEach(asset => {
                const item = document.createElement('div');
                item.className = 'asset-item';
                
                let thumbSrc = '#333';
                if(asset.image) {
                    thumbSrc = supabaseClient.storage.from('user-assets').getPublicUrl(`users/${currentUser.id}/${currentCategory}/${asset.image}`).data.publicUrl;
                }

                item.innerHTML = `
                    <img src="${thumbSrc}" class="asset-thumb">
                    <span>${asset.name}</span>
                `;
                item.onclick = () => selectAsset(asset);
                listEl.appendChild(item);
            });
        }

        async function selectAsset(asset) {
            selectedAsset = asset;
            document.querySelectorAll('.asset-item').forEach(el => el.classList.remove('active'));
            event.currentTarget.classList.add('active');

            document.getElementById('welcome-msg').classList.add('hidden');
            document.getElementById('editor').classList.add('active');
            document.getElementById('global-editor').classList.remove('active');
            document.getElementById('edit-asset-name').innerText = asset.name;

            if(asset.prompt) {
                const { data } = await supabaseClient.storage.from('user-assets').download(`users/${currentUser.id}/${currentCategory}/${asset.prompt}`);
                const text = await data.text();
                document.getElementById('prompt-text').value = text;
            } else {
                document.getElementById('prompt-text').value = '';
            }

            const preview = document.getElementById('ref-preview');
            if(asset.image) {
                preview.src = supabaseClient.storage.from('user-assets').getPublicUrl(`users/${currentUser.id}/${currentCategory}/${asset.image}`).data.publicUrl;
                preview.classList.remove('hidden');
            } else {
                preview.classList.add('hidden');
            }

            let config = { strength: 0.6, fidelity: 0.8 };
            if(asset.config) {
                const { data } = await supabaseClient.storage.from('user-assets').download(`users/${currentUser.id}/${currentCategory}/${asset.config}`);
                config = await data.json();
            }
            document.getElementById('ref-strength').value = config.strength;
            document.getElementById('strength-val').innerText = config.strength;
            document.getElementById('ref-fidelity').value = config.fidelity;
            document.getElementById('fidelity-val').innerText = config.fidelity;
        }

        document.getElementById('ref-strength').oninput = (e) => document.getElementById('strength-val').innerText = e.target.value;
        document.getElementById('ref-fidelity').oninput = (e) => document.getElementById('fidelity-val').innerText = e.target.value;

        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.onclick = () => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentCategory = btn.dataset.category;
                document.getElementById('add-asset-box').style.display = currentCategory === 'global' ? 'none' : 'flex';
                
                document.getElementById('editor').classList.remove('active');
                document.getElementById('global-editor').classList.remove('active');
                document.getElementById('welcome-msg').classList.remove('hidden');
                
                loadAssets();
            };
        });

        document.getElementById('add-asset-btn').onclick = async () => {
            const name = document.getElementById('new-asset-name').value.trim();
            if(!name) return;

            const fileName = `${name}.txt`;
            const { error } = await supabaseClient.storage.from('user-assets').upload(`users/${currentUser.id}/${currentCategory}/${fileName}`, 
                new Blob(['프롬프트를 입력하세요.'], {type: 'text/plain'}), { upsert: true });

            if(error) alert(error.message);
            else {
                document.getElementById('new-asset-name').value = '';
                loadAssets();
            }
        };

        document.getElementById('save-asset-btn').onclick = async () => {
            if(!selectedAsset) return;
            const name = selectedAsset.name;
            const folderPath = `users/${currentUser.id}/${currentCategory}`;

            const text = document.getElementById('prompt-text').value;
            await supabaseClient.storage.from('user-assets').upload(`${folderPath}/${name}.txt`, 
                new Blob([text], {type: 'text/plain'}), { upsert: true });

            const config = {
                strength: document.getElementById('ref-strength').value,
                fidelity: document.getElementById('ref-fidelity').value
            };
            await supabaseClient.storage.from('user-assets').upload(`${folderPath}/${name}.json`, 
                new Blob([JSON.stringify(config)], {type: 'application/json'}), { upsert: true });

            alert('에셋과 설정값이 저장되었습니다!');
        };

        document.getElementById('upload-img-btn').onclick = () => document.getElementById('ref-upload').click();
        document.getElementById('ref-upload').onchange = async (e) => {
            const file = e.target.files[0];
            if(!file || !selectedAsset) return;

            const ext = file.name.split('.').pop().toLowerCase();
            const fileName = `${selectedAsset.name}.${ext}`;

            const { error } = await supabaseClient.storage.from('user-assets').upload(`users/${currentUser.id}/${currentCategory}/${fileName}`, file, { upsert: true });

            if(error) alert(error.message);
            else {
                alert('이미지가 업데이트되었습니다.');
                selectedAsset.image = fileName;
                selectAsset(selectedAsset);
                loadAssets();
            }
        };

        document.getElementById('delete-asset-btn').onclick = async () => {
            if(!selectedAsset || !confirm('정말 삭제하시겠습니까?')) return;
            
            const filesToDelete = [];
            if(selectedAsset.prompt) filesToDelete.push(`${selectedAsset.name}.txt`);
            if(selectedAsset.image) filesToDelete.push(selectedAsset.image);
            filesToDelete.push(`${selectedAsset.name}.json`);

            const { error } = await supabaseClient.storage.from('user-assets').remove(
                filesToDelete.map(f => `users/${currentUser.id}/${currentCategory}/${f}`)
            );

            if(error) alert(error.message);
            else {
                alert('삭제되었습니다.');
                loadAssets();
                document.getElementById('editor').classList.remove('active');
                document.getElementById('welcome-msg').classList.remove('hidden');
                }
        };

        async function loadGlobalSettings() {
            document.getElementById('welcome-msg').classList.add('hidden');
            document.getElementById('editor').classList.remove('active');
            document.getElementById('global-editor').classList.add('active');

            const { data, error } = await supabaseClient.from('profiles').select('*').eq('id', currentUser.id).single();
            
            if(error) {
                console.error(error);
                alert('글로벌 설정을 불러오지 못했습니다.');
                return;
            }

            document.getElementById('global-provider').value = data.ai_provider || 'stability';
            document.getElementById('global-api-key').value = data.api_key || '';
            document.getElementById('global-positive').value = data.base_positive || '';
            document.getElementById('global-negative').value = data.base_negative || '';
        }

        document.getElementById('save-global-btn').onclick = async () => {
            const updates = {
                ai_provider: document.getElementById('global-provider').value,
                api_key: document.getElementById('global-api-key').value,
                base_positive: document.getElementById('global-positive').value,
                base_negative: document.getElementById('global-negative').value,
                updated_at: new Date().toISOString()
            };

            const { error } = await supabaseClient.from('profiles').update(updates).eq('id', currentUser.id).single();

            if(error) alert(error.message);
            else alert('global 설정이 저장되었습니다!');
        };

        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(loadAssets, 500);
        });
    </script>
</body>
</html>
